name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docker/**"
      - "*.sql"
      - "*.dump"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "docker/**"
      - "*.sql"
      - "*.dump"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Workflow-level variables (non-sensitive credentials for the test database).
#
# Configure in: Settings → Variables → Actions
#   DOCKERHUB_USERNAME   – Docker Hub account to push images to
#   MYSQL_ROOT_PASSWORD  – root password used when building/testing MySQL images
#   POSTGRES_PASSWORD    – password used when building/testing PostgreSQL images
#
# All fall back to safe defaults if not configured.
# Use `vars.*` (not `secrets.*`) so values are visible in job logs.
# ---------------------------------------------------------------------------
env:
  MYSQL_ROOT_PASSWORD: ${{ vars.MYSQL_ROOT_PASSWORD || 'test' }}
  POSTGRES_PASSWORD: ${{ vars.POSTGRES_PASSWORD || 'test' }}

jobs:
  # ===========================================================================
  # MySQL images  (single repo: test-db, tags: mysql-8.4 / mysql-9.5)
  # ===========================================================================
  build-mysql:
    name: MySQL ${{ matrix.mysql-version }} (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql-version: "8.4"
            dockerfile: "docker/mysql/Dockerfile.mysql84"
            platforms: "linux/amd64,linux/arm64"
          - mysql-version: "9.5"
            dockerfile: "docker/mysql/Dockerfile.mysql95"
            platforms: "linux/amd64,linux/arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU enables cross-platform emulation (required for arm64 on amd64 runners)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx is the multi-platform build driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Login – only on actual pushes, not PRs (to protect secrets)
      # -----------------------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Extract metadata for image labels & tags
      # Single repo `test-db`, tag format: mysql-8.4 / mysql-9.5
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/test-db
          tags: type=raw,value=mysql-${{ matrix.mysql-version }}

      # -----------------------------------------------------------------------
      # Build (and push on non-PR events)
      # -----------------------------------------------------------------------
      - name: Build and push MySQL ${{ matrix.mysql-version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in GitHub Actions cache (per platform)
          cache-from: type=gha,scope=mysql-${{ matrix.mysql-version }}
          cache-to: type=gha,mode=max,scope=mysql-${{ matrix.mysql-version }}

      # -----------------------------------------------------------------------
      # Smoke test: build amd64-only image, start container, wait until the
      # employees table is queryable (proving init completed), then verify row count.
      # -----------------------------------------------------------------------
      - name: Smoke test – MySQL ${{ matrix.mysql-version }}
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "==> Building single-arch test image for smoke test..."
          docker build \
            --platform linux/amd64 \
            -f ${{ matrix.dockerfile }} \
            -t test-db-mysql:smoke \
            .

          echo "==> Starting container (password from vars.MYSQL_ROOT_PASSWORD)..."
          CID=$(docker run -d \
            -e MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
            --health-cmd "MYSQL_PWD=${MYSQL_ROOT_PASSWORD} mysql -uroot employees -e 'SELECT 1 FROM employees LIMIT 1;'" \
            --health-start-period=30s \
            --health-interval=15s \
            --health-timeout=10s \
            --health-retries=40 \
            test-db-mysql:smoke)

          echo "==> Waiting for employees data to be fully loaded (up to ~600s)..."
          for i in $(seq 1 80); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy after approx $((i*8))s"
              break
            fi
            if [ "$i" -eq 80 ]; then
              echo "ERROR: Container did not become healthy in time"
              docker logs "$CID"
              docker rm -f "$CID"
              exit 1
            fi
            sleep 8
          done

          echo "==> Verifying employees table count..."
          COUNT=$(docker exec -e MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" "$CID" \
            mysql -uroot -BN -e "SELECT COUNT(*) FROM employees.employees;")
          echo "employees table rows: $COUNT"
          [ "$COUNT" -eq 300024 ] || {
            echo "ERROR: Expected 300024 rows, got $COUNT"
            docker logs "$CID"
            docker rm -f "$CID"
            exit 1
          }

          echo "==> Smoke test PASSED for MySQL ${{ matrix.mysql-version }}!"
          docker rm -f "$CID"

  # ===========================================================================
  # PostgreSQL images  (single repo: test-db, tags: postgresql-16 / postgresql-17)
  # ===========================================================================
  build-postgresql:
    name: PostgreSQL ${{ matrix.pg-version }} (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg-version: "16"
            dockerfile: "docker/postgresql/Dockerfile.pg16"
            platforms: "linux/amd64,linux/arm64"
          - pg-version: "17"
            dockerfile: "docker/postgresql/Dockerfile.pg17"
            platforms: "linux/amd64,linux/arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Single repo `test-db`, tag format: postgresql-16 / postgresql-17
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/test-db
          tags: type=raw,value=postgresql-${{ matrix.pg-version }}

      - name: Build and push PostgreSQL ${{ matrix.pg-version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=postgresql-${{ matrix.pg-version }}
          cache-to: type=gha,mode=max,scope=postgresql-${{ matrix.pg-version }}

      # -----------------------------------------------------------------------
      # Smoke test: health-check queries employees table directly so the test
      # only passes after init.sh has fully loaded all data.
      # -----------------------------------------------------------------------
      - name: Smoke test – PostgreSQL ${{ matrix.pg-version }}
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          echo "==> Building single-arch test image for smoke test..."
          docker build \
            --platform linux/amd64 \
            -f ${{ matrix.dockerfile }} \
            -t test-db-postgresql:smoke \
            .

          echo "==> Starting container (password from vars.POSTGRES_PASSWORD)..."
          CID=$(docker run -d \
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --health-cmd "psql -U postgres -d employees -c 'SELECT 1 FROM employees LIMIT 1;'" \
            --health-start-period=30s \
            --health-interval=15s \
            --health-timeout=10s \
            --health-retries=40 \
            test-db-postgresql:smoke)

          echo "==> Waiting for employees data to be fully loaded (up to ~600s)..."
          for i in $(seq 1 80); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy after approx $((i*8))s"
              break
            fi
            if [ "$i" -eq 80 ]; then
              echo "ERROR: Container did not become healthy in time"
              docker logs "$CID"
              docker rm -f "$CID"
              exit 1
            fi
            sleep 8
          done

          echo "==> Verifying employees table count..."
          COUNT=$(docker exec "$CID" psql -U postgres -d employees -tAc \
            "SELECT COUNT(*) FROM employees;")
          echo "employees table rows: $COUNT"
          [ "$COUNT" -eq 300024 ] || {
            echo "ERROR: Expected 300024 rows, got $COUNT"
            docker logs "$CID"
            docker rm -f "$CID"
            exit 1
          }

          echo "==> Smoke test PASSED for PostgreSQL ${{ matrix.pg-version }}!"
          docker rm -f "$CID"
